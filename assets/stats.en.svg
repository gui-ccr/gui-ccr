  <text x="24" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">1st place · Shark TADS</text>
