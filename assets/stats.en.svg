<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Career highlights">
<title>Career highlights</title>
<style>.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes ln{from{width:0}to{width:280px}}.ln{width:0;animation:ln 1s cubic-bezier(.2,.7,.2,1) forwards}@media (prefers-reduced-motion: reduce){*{animation:none!important}.up{opacity:1!important}}@media (prefers-reduced-motion: reduce){.ln{width:280px}}</style>
